name: Bounded scientific checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reproduce and compare finite science from the flat artifact root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scientific-output
          ulimit -v 2097152
          ulimit -t 110
          cpu=$(python -B -c 'import os; print(min(os.sched_getaffinity(0)))')
          taskset -c "$cpu" timeout --signal=TERM --kill-after=5s 240s \
            python -B verify.py --work-dir "$RUNNER_TEMP/countcuts-check" \
              --logs "$GITHUB_WORKSPACE/scientific-output/commands" \
              >scientific-output/whole-run.stdout 2>scientific-output/whole-run.stderr
      - name: Preserve raw outputs even after a failed check
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: countcuts-scientific-output
          path: |
            scientific-output/
            ${{ runner.temp }}/countcuts-check/
          if-no-files-found: warn
          retention-days: 14
